{% if footer.whatsapp_number or footer.phone_number or footer.contact_email %}
    <div class="floating-actions">
        {% if footer.whatsapp_number %}
            <a href="{% if 'http' in footer.whatsapp_number %}{{ footer.whatsapp_number }}{% else %}https://wa.me/{{ footer.whatsapp_number }}{% endif %}" target="_blank" rel="noopener" class="floating-actions__btn floating-actions__btn--whatsapp" aria-label="Chat on WhatsApp">
                <svg viewBox="0 0 24 24" fill="currentColor" width="24" height="24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.198.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.347-.174-1.464-.54-2.788-1.72-1.03-.918-1.727-2.054-1.928-2.401-.201-.347-.021-.535.153-.706.157-.157.35-.41.524-.615.174-.204.232-.35.35-.582.116-.232.058-.436-.029-.611-.087-.174-.782-1.884-1.072-2.581-.282-.678-.567-.586-.78-.597-.202-.01-.433-.012-.665-.012-.232 0-.61.087-.929.436-.319.35-1.218 1.19-1.218 2.9 0 1.71 1.247 3.362 1.42 3.596.174.232 2.451 3.744 5.94 5.25.83.358 1.478.573 1.983.734.833.265 1.591.227 2.19.138.668-.1 2.058-.842 2.348-1.655.29-.812.29-1.51.203-1.655-.087-.145-.319-.232-.667-.407z"/><path d="M12 2C6.477 2 2 6.477 2 12c0 1.85.508 3.639 1.472 5.198L2 22l4.958-1.442A9.953 9.953 0 0 0 12 22c5.523 0 10-4.477 10-10S17.523 2 12 2zm0 18.181c-1.605 0-3.145-.42-4.483-1.213l-.322-.19-3.324.968.972-3.24-.21-.335A8.156 8.156 0 0 1 3.818 12c0-4.517 3.665-8.182 8.182-8.182S20.182 7.483 20.182 12 16.517 20.181 12 20.181z"/></svg>
            </a>
        {% endif %}
        {% if footer.phone_number %}
            <a href="tel:{{ footer.phone_number }}" class="floating-actions__btn floating-actions__btn--call" aria-label="Call us">
                <span class="material-symbols-rounded">call</span>
            </a>
        {% endif %}
        {% if footer.contact_email %}
            <a href="mailto:{{ footer.contact_email }}" class="floating-actions__btn floating-actions__btn--email" aria-label="Email us">
                <span class="material-symbols-rounded">mail</span>
            </a>
        {% endif %}
    </div>
{% endif %}
